<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>School Management | Tech Power Schools</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
:root{--navy:#102449;--blue:#2457d6;--cyan:#18b6c9;--ink:#17243b;--muted:#64748b;--line:#e2e8f0;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;font:15px/1.55 Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.wrap{max-width:1200px;margin:auto;padding:24px}.top{background:var(--navy);color:#fff;padding:16px 24px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:850;letter-spacing:.3px}.top a{color:#fff;text-decoration:none}.btn{background:var(--blue);color:white;border:0;border-radius:8px;padding:11px 16px;font-weight:750}.btn.secondary{background:#eaf0ff;color:var(--blue)}.btn.danger{background:#b42318}.auth{max-width:470px;margin:55px auto;background:#fff;padding:30px;border-radius:18px;box-shadow:0 15px 45px #10244912}.auth h1{color:var(--navy);margin-top:0}.field{margin:13px 0}.field label{display:block;font-weight:700;font-size:13px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #ccd6e4;border-radius:8px;background:white}.muted{color:var(--muted)}.notice{padding:12px;border-radius:8px;background:#eef5ff;color:#24416b;font-size:13px;margin:14px 0}.error{color:#b42318}.success{color:#087d73}.dash{display:grid;grid-template-columns:230px 1fr;gap:22px;margin-top:24px}.side,.panel,.stat{background:white;border:1px solid var(--line);border-radius:14px}.side{padding:14px;height:max-content}.side button{display:block;width:100%;text-align:left;padding:12px;border:0;background:white;border-radius:8px;color:#34445c;font-weight:650}.side button.active,.side button:hover{background:#edf2ff;color:var(--blue)}.main{min-width:0}.headrow{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}.headrow h1{margin:0;color:var(--navy)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{padding:18px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:27px;color:var(--navy)}.panel{padding:20px;margin-bottom:16px}.panel h2{margin:0 0 14px;color:var(--navy);font-size:20px}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:650px}th,td{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:13px}th{background:#f7f9fc;color:#40516a}.pill{padding:4px 8px;border-radius:20px;background:#eef2ff;color:#314f9c;font-size:11px;font-weight:800}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{padding:7px 9px;font-size:12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:8px}.tabs button.active{background:var(--navy);color:white}.empty{padding:20px;text-align:center;color:var(--muted)}@media(max-width:800px){.dash{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.wrap{padding:14px}.auth{margin:25px 14px;padding:22px}.formgrid,.stats{grid-template-columns:1fr}.side{grid-template-columns:1fr 1fr}.headrow h1{font-size:23px}}
</style></head><body>
<div class="top"><div class="brand">TECH POWER SCHOOLS <span style="font-weight:400;color:#b8c9e2">/ School Portal</span></div><a href="index.html">← Main website</a></div>
<div id="auth" class="auth"><h1>Welcome to your school portal</h1><p class="muted">Sign in with your registered school account.</p><div class="field"><label>Email address</label><input id="email" type="email" autocomplete="username" placeholder="name@example.com"></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button class="btn" id="login" style="width:100%">Sign in</button><div class="notice">New student? Use the public admission form on the main website. Portal accounts are issued by the school after registration.</div><p id="authmsg" aria-live="polite"></p></div>
<div id="app" class="wrap hidden"><div class="headrow"><div><h1 id="welcome">Dashboard</h1><div class="muted" id="rolelabel"></div></div><button class="btn secondary" id="logout">Sign out</button></div><div class="dash"><aside class="side" id="nav"></aside><main class="main"><div id="view"></div></main></div></div>
<script>
const SB_URL='https://hafyuuceuzhudvznopcb.supabase.co';
const SB_KEY='sb_publishable_Xz7_i8vmNeql7VJY4KTHSw_toDnTT50';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
let profile=null,active='overview';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,ok=false){$('authmsg').textContent=t;$('authmsg').className=ok?'success':'error'}
$('login').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return msg(error.message);await boot()};
$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function boot(){const {data:{user}}=await sb.auth.getUser();if(!user)return;const {data,error}=await sb.from('profiles').select('*').eq('id',user.id).single();if(error){msg('Your profile is not ready. Contact the school administrator.');return}profile=data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('welcome').textContent='Welcome, '+profile.full_name;$('rolelabel').textContent=profile.role.toUpperCase()+' ACCOUNT';renderNav();await show('overview')}
function renderNav(){const items=profile.role==='admin'?['overview','admissions','students','guardians','classes','assessments','results','announcements','users']:profile.role==='staff'?['overview','students','classes','assessments','results','attendance','announcements']:profile.role==='parent'?['overview','children','results','attendance','announcements']:['overview','my-results','my-attendance','announcements'];$('nav').innerHTML=items.map(x=>'<button class="'+(x===active?'active':'')+'" data-page="'+x+'">'+x.replace(/-/g,' ').replace(/^./,c=>c.toUpperCase())+'</button>').join('');$('nav').querySelectorAll('button').forEach(b=>b.onclick=()=>show(b.dataset.page))}
async function rows(table,select='*',order='created_at'){let q=sb.from(table).select(select);if(order)q=q.order(order,{ascending:false});const {data,error}=await q; if(error)throw error;return data||[]}
function table(headers,body){return '<div class="tablewrap"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+(body||'<tr><td colspan="'+headers.length+'" class="empty">No records yet</td></tr>')+'</tbody></table></div>'}
function panel(title,body){return '<section class="panel"><h2>'+title+'</h2>'+body+'</section>'}
function field(label,name,type='text',required=true){return '<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+type+'" '+(required?'required':'')+'></div>'}
async function show(page){active=page;renderNav();const v=$('view');v.innerHTML='<div class="panel">Loading records…</div>';try{
if(page==='overview'){let [a,s,c]=await Promise.all([rows('admissions','id,status','created_at'),rows('students','id,active',null),rows('classes','id',null)]);v.innerHTML='<div class="stats"><div class="stat"><small>Admission applications</small><strong>'+a.length+'</strong></div><div class="stat"><small>Student records</small><strong>'+s.length+'</strong></div><div class="stat"><small>Classes / groups</small><strong>'+c.length+'</strong></div></div>'+panel('Quick overview','<p class="muted">Use the navigation to manage school records. Assign staff and parent roles through the administrator account after creating their user accounts.</p>')+panel('Account information','<p><b>Name:</b> '+esc(profile.full_name)+'</p><p><b>Email:</b> '+esc(profile.email)+'</p><p><b>Access level:</b> '+esc(profile.role)+'</p>')}
else if(page==='admissions'){if(!['admin','staff'].includes(profile.role))throw Error('Not authorised');let a=await rows('admissions');v.innerHTML=panel('Admission applications',table(['Applicant','Contact','Programme','Guardian','Status','Action'],a.map(x=>'<tr><td>'+esc(x.applicant_name)+'</td><td>'+esc(x.applicant_email)+'<br>'+esc(x.applicant_phone)+'</td><td>'+esc(x.programme)+'</td><td>'+esc(x.guardian_name)+'<br>'+esc(x.guardian_phone)+'</td><td><span class="pill">'+esc(x.status)+'</span></td><td><div class="actions"><button class="btn secondary" onclick="statusAdmission(\''+x.id+'\',\'under_review\')">Review</button><button class="btn" onclick="statusAdmission(\''+x.id+'\',\'approved\')">Approve</button><button class="btn danger" onclick="statusAdmission(\''+x.id+'\',\'rejected\')">Reject</button></div></td></tr>').join('')))}
else if(page==='students'||page==='children'){let q=sb.from('students').select('id,student_number,full_name,active,class_id');if(page==='children'&&profile.role==='parent'){const {data:g}=await sb.from('guardians').select('id').eq('user_id',profile.id);const gids=(g||[]).map(x=>x.id);const {data:links}=await sb.from('student_guardians').select('student_id').in('guardian_id',gids);q=q.in('id',(links||[]).map(x=>x.student_id))}const {data,error}=await q;if(error)throw error;v.innerHTML=panel('Student records',table(['Student number','Full name','Class ID','Status'],(data||[]).map(x=>'<tr><td>'+esc(x.student_number)+'</td><td>'+esc(x.full_name)+'</td><td>'+esc(x.class_id||'Not assigned')+'</td><td>'+ (x.active?'Active':'Inactive')+'</td></tr>').join('')))+(profile.role==='admin'?panel('Register student','<form id="studentform" class="formgrid">'+field('Student number','student_number')+field('Full name','full_name')+field('Date of birth','date_of_birth','date',false)+'<div class="field"><label>Class</label><select name="class_id" id="studentclass"><option value="">Unassigned</option></select></div><div><button class="btn">Create student record</button></div></form>'):'' );if($('studentform')){const cs=await rows('classes','id,name',null);$('studentclass').innerHTML='<option value="">Unassigned</option>'+cs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('studentform').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.student_number=d.student_number.trim();if(!d.class_id)delete d.class_id;if(!d.date_of_birth)delete d.date_of_birth;const {error}=await sb.from('students').insert(d);if(error)alert(error.message);else show('students')}}}
else if(page==='classes'){let c=await rows('classes','*',null);v.innerHTML=panel('Classes and cohorts',table(['Name','Level','Academic year'],c.map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.level)+'</td><td>'+esc(x.academic_year)+'</td></tr>').join('')))+(profile.role==='admin'||profile.role==='staff'?panel('Create class','<form id="classform" class="formgrid">'+field('Class / cohort name','name')+field('Level','level', 'text',false)+field('Academic year','academic_year','text',false)+'<div><button class="btn">Add class</button></div></form>'):'');$('classform')?.addEventListener('submit',createClass)}
else if(page==='assessments'){let c=await rows('assessments');v.innerHTML=panel('Tests, exams and assessments',table(['Title','Subject','Type','Max score','Due','Published'],c.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.assessment_type)+'</td><td>'+esc(x.max_score)+'</td><td>'+esc(x.due_date)+'</td><td>'+ (x.published?'Yes':'No')+'</td></tr>').join('')))+(profile.role==='admin'||profile.role==='staff'?panel('Create assessment','<form id="assessmentform" class="formgrid">'+field('Title','title')+field('Subject','subject')+'<div class="field"><label>Assessment type</label><select name="assessment_type"><option>test</option><option>exam</option><option>assignment</option><option>project</option></select></div>'+field('Maximum score','max_score','number')+field('Due date','due_date','date',false)+'<div class="field"><label>Class</label><select name="class_id" id="assclass"></select></div><div><button class="btn">Create assessment</button></div></form>'):'');if($('assessmentform')){const cs=await rows('classes','id,name',null);$('assclass').innerHTML=cs.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');$('assessmentform').onsubmit=createAssessment}}
else if(page==='results'||page==='my-results'){let q=sb.from('results').select('id,score,remarks,published,student_id,assessment_id');if(page==='my-results'){const {data:s}=await sb.from('students').select('id').eq('user_id',profile.id);q=q.in('student_id',(s||[]).map(x=>x.id))}const {data,error}=await q;if(error)throw error;v.innerHTML=panel('Academic results',table(['Student ID','Assessment ID','Score','Remarks','Published'],(data||[]).map(x=>'<tr><td>'+esc(x.student_id)+'</td><td>'+esc(x.assessment_id)+'</td><td>'+esc(x.score)+'</td><td>'+esc(x.remarks)+'</td><td>'+ (x.published?'Yes':'Pending')+'</td></tr>').join('')))+(profile.role==='admin'||profile.role==='staff'?panel('Enter result','<form id="resultform" class="formgrid">'+field('Student ID','student_id')+field('Assessment ID','assessment_id')+field('Score','score','number')+field('Remarks','remarks','text',false)+'<div><button class="btn">Save result</button></div></form>'):'');$('resultform')?.addEventListener('submit',saveResult)}
else if(page==='guardians'){let g=await rows('guardians');v.innerHTML=panel('Parent and guardian records',table(['Name','Phone','Email','User ID'],g.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.user_id||'Account not linked')+'</td></tr>').join('')))+panel('Create guardian record','<form id="guardianform" class="formgrid">'+field('Full name','full_name')+field('Phone','phone')+field('Email','email','email',false)+field('Linked user ID (optional)','user_id','text',false)+'<div><button class="btn">Save guardian</button></div></form>');$('guardianform').onsubmit=createGuardian}
else if(page==='users'){let p=await rows('profiles','id,full_name,email,phone,role');v.innerHTML=panel('User accounts and access roles',table(['Name','Email','Phone','Role','Change role'],p.map(x=>'<tr><td>'+esc(x.full_name)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.role)+'</td><td><select onchange="changeRole(\''+x.id+'\',this.value)"><option value="">Select role</option>'+['admin','staff','student','parent'].map(r=>'<option '+(x.role===r?'selected':'')+'>'+r+'</option>').join('')+'</select></td></tr>').join(''))+'<div class="notice">Create user accounts in Supabase Authentication first. Then assign the appropriate role here. Keep administrator access restricted to trusted school leadership.</div>')}
else if(page==='announcements'){let a=await rows('announcements');v.innerHTML=panel('School announcements',a.map(x=>'<article style="padding:12px 0;border-bottom:1px solid #e2e8f0"><b>'+esc(x.title)+'</b><p>'+esc(x.body)+'</p><small class="muted">'+esc(x.audience)+'</small></article>').join('')||'<p class="empty">No announcements published.</p>')+(profile.role==='admin'||profile.role==='staff'?panel('Publish announcement','<form id="annform">'+field('Title','title')+'<div class="field"><label>Message</label><textarea name="body" required></textarea></div><div class="field"><label>Audience</label><select name="audience"><option>all</option><option>student</option><option>parent</option><option>staff</option></select></div><button class="btn">Publish</button></form>'):'');$('annform')?.addEventListener('submit',publishAnnouncement)}
else if(page==='attendance'||page==='my-attendance'){let q=sb.from('attendance').select('*');if(page==='my-attendance'){const {data:s}=await sb.from('students').select('id').eq('user_id',profile.id);q=q.in('student_id',(s||[]).map(x=>x.id))}const {data,error}=await q;if(error)throw error;v.innerHTML=panel('Attendance',table(['Student ID','Date','Status','Class'],(data||[]).map(x=>'<tr><td>'+esc(x.student_id)+'</td><td>'+esc(x.attendance_date)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.class_id)+'</td></tr>').join('')))+(page==='attendance'?panel('Record attendance','<form id="attform" class="formgrid">'+field('Student ID','student_id')+field('Class ID','class_id')+field('Date','attendance_date','date',false)+'<div class="field"><label>Status</label><select name="status"><option>present</option><option>absent</option><option>late</option><option>excused</option></select></div><div><button class="btn">Save attendance</button></div></form>'):'');$('attform')?.addEventListener('submit',recordAttendance)}
}catch(e){v.innerHTML='<div class="panel error">'+esc(e.message||'Unable to load this section.')+'</div>'}}
async function statusAdmission(id,status){const {error}=await sb.from('admissions').update({status,reviewed_by:profile.id}).eq('id',id);if(error)alert(error.message);else show('admissions')}
async function createClass(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));const {error}=await sb.from('classes').insert(d);if(error)alert(error.message);else show('classes')}
async function createAssessment(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.max_score=Number(d.max_score);d.created_by=profile.id;const {error}=await sb.from('assessments').insert(d);if(error)alert(error.message);else show('assessments')}
async function saveResult(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.score=Number(d.score);d.entered_by=profile.id;const {error}=await sb.from('results').upsert(d,{onConflict:'assessment_id,student_id'});if(error)alert(error.message);else show('results')}
async function createGuardian(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(!d.user_id)delete d.user_id;const {error}=await sb.from('guardians').insert(d);if(error)alert(error.message);else show('guardians')}
async function publishAnnouncement(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.created_by=profile.id;const {error}=await sb.from('announcements').insert(d);if(error)alert(error.message);else show('announcements')}
async function recordAttendance(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.recorded_by=profile.id;const {error}=await sb.from('attendance').upsert(d,{onConflict:'student_id,attendance_date'});if(error)alert(error.message);else show('attendance')}
async function changeRole(id,role){if(!role)return;if(!confirm('Change this account role to '+role+'?'))return;const {error}=await sb.rpc('set_school_user_role',{target_user:id,new_role:role});if(error)alert(error.message);else show('users')}
sb.auth.getSession().then(({data})=>{if(data.session)boot()});
</script></body></html>
